  <rect x="650" y="148" width="152" height="48" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="726" y="168" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#1D4ED8">class: FAQ</text>
