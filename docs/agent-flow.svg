  <!-- 화면 전환 -->
  <path d="M804 48 C830 48 828 92 846 100" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M804 110 H846" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M804 172 C830 172 828 128 846 120" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="850" y="72" width="102" height="76" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
