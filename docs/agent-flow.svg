  <text x="498" y="114" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#92400E">class · action</text>
  <text x="498" y="133" text-anchor="middle" font-size="10" fill="#B45309">▼ 값에 따라 분기</text>

  <!-- 분기 -->
  <path d="M576 110 C616 110 612 48 648 48" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#a)"/>
  <path d="M576 110 H648" fill="none" stroke="#DB2777" stroke-width="2" marker-end="url(#a)"/>
  <path d="M576 110 C616 110 612 172 648 172" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#a)"/>

  <rect x="650" y="24" width="152" height="48" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
