  <path d="M122 110 H142" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <!-- AI Agent -->
  <rect x="148" y="46" width="248" height="128" rx="18" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="272" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#6D28D9">🤖 AI Agent</text>
  <rect x="160" y="84" width="68" height="34" rx="10" fill="#EDE9FE" stroke="#A78BFA"/>
  <text x="194" y="106" text-anchor="middle" font-size="12" fill="#1F2937">① 이해</text>
  <path d="M230 101 H236" stroke="#A78BFA" stroke-width="2" marker-end="url(#a)"/>
  <rect x="238" y="84" width="68" height="34" rx="10" fill="#EDE9FE" stroke="#A78BFA"/>
