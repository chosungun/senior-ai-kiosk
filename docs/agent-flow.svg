  <rect x="316" y="84" width="68" height="34" rx="10" fill="#EDE9FE" stroke="#A78BFA"/>
  <text x="350" y="106" text-anchor="middle" font-size="12" fill="#1F2937">③ 액션</text>
  <text x="272" y="142" text-anchor="middle" font-size="10" fill="#6B7280">대화 + 메뉴 + 장바구니 상태를 함께 고려</text>
  <path d="M398 110 H418" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

  <!-- 구조화 출력 (강조) -->
